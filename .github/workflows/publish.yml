name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@5ff8be1833b05bfdbe396b3e46e0802822b94615 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
