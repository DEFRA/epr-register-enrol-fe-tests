name: Check Pull Request

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.12.1 --ignore-scripts
      - run: |
          npm ci --ignore-scripts
          npm run format:check
          npm run lint
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build .

  tests:
    name: Run Journey Tests
    # Pinned: on ubuntu-26.04 (what ubuntu-latest now resolves to) wdio's local runner crashes every
    # spec with "write EINVAL" before it runs. Move back to ubuntu-latest once that is fixed.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout journey-tests repo
        uses: actions/checkout@v7
      - name: Run journey tests
        uses: ./run-journey-tests
        with:
          branch: ${{ github.head_ref }}
          journey-test-pr: true
